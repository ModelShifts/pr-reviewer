name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (no model backends; tests use a mocked LLM)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Samples are reproducible
        run: |
          python scripts/make_samples.py
          git diff --exit-code -- samples/
      - name: Tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          pr-reviewer --version
          # api backend without a base URL must fail with a clear message (exit 2)
          MS_BACKEND=api pr-reviewer review --diff samples/diffs/picker-index.diff || test $? -eq 2
