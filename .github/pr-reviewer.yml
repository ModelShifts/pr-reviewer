# Rules for pr-reviewer. Copy this file to the repository being reviewed.
strictness: normal          # relaxed | normal | strict
focus:
  - correctness
  - security
  - tests
ignore:
  - "**/*.lock"
  - "docs/**"
max_comments: 20
jira:
  enabled: false            # set true to link the review through ModelShifts/jira-bridge
  send: false               # true posts the comment; false previews it
