[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-reviewer"
version = "0.0.1"
description = "A GitHub Action that reviews pull requests and leaves comments on the diff."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Modelshifts", email = "info@modelshifts.com" }]
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
api = ["openai>=1.40"]
hf = ["huggingface_hub>=0.25"]

[project.urls]
Homepage = "https://modelshifts.com/work"
Repository = "https://github.com/ModelShifts/pr-reviewer"

[project.scripts]
pr-reviewer = "pr_reviewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]
